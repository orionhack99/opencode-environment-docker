# ---------------------------------------------------------------------------
# Sandbox Docker: OpenCode + Herdr sobre Kali Linux
#
# Uso:
#   docker compose run --rm sandbox            # shell interativo
#   docker compose run --rm sandbox opencode   # abre o agente de IA
#   docker compose run --rm sandbox herdr      # abre o painel do Herdr
#   docker compose up -d sandbox               # container em background
#   docker compose down -v                     # remove container e volumes
# ---------------------------------------------------------------------------
name: opencode-kali-sandbox

services:
  sandbox:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Fixe uma versão (ex.: 1.2.3) para builds reprodutíveis. Vazio = latest.
        OPENCODE_VERSION: "${OPENCODE_VERSION:-}"
    image: opencode-sandbox:latest

    # tini como PID 1: reaping de processos e repasse de SIGTERM/SIGINT,
    # essencial porque o herdr abre subprocessos (agentes, shells, shells de pentest).
    init: true

    # Terminal interativo (o herdr e o opencode são TUIs).
    stdin_open: true
    tty: true

    # ------------------------------------------------------------------
    # Limites de recursos (rede de segurança dentro da VM que hospeda o
    # sandbox). São tetos, não reservas: só mordem em caso de runaway.
    # O pentest abre muitos processos (nuclei, ffuf, masscan, metasploit)
    # e consome memória, então os valores são generosos.
    # Ajuste por variável de ambiente se a VM for menor:
    #   SANDBOX_PIDS_LIMIT=1024 SANDBOX_MEM_LIMIT=4g SANDBOX_CPUS=2
    # ------------------------------------------------------------------
    pids_limit: ${SANDBOX_PIDS_LIMIT:-4096}
    mem_limit: ${SANDBOX_MEM_LIMIT:-8g}
    cpus: ${SANDBOX_CPUS:-4}

    working_dir: /workspace

    environment:
      TERM: xterm-256color
      COLORTERM: truecolor
      LANG: C.UTF-8
      # Container não tem placa de som.
      HERDR_DISABLE_SOUND: "1"

    volumes:
      # Pasta de trabalho do agente — e só isto que vem do host.
      # Não é o repo do sandbox: é uma pasta dedicada, vazia por padrão,
      # onde você (ou um -v no `compose run`) coloca o alvo do teste.
      #
      # Crie-a uma vez com a posse do usuário do container (uid 1000),
      # senão o Docker cria como root e o agente não consegue gravar:
      #   mkdir -p workspace && sudo chown -R 1000:1000 workspace
      - ./workspace:/workspace

      # Persistência entre recriações do container (volumes nomeados):
      #   opencode-config → /root/.config/opencode      (config do opencode)
      #   opencode-data   → /root/.local/share/opencode (auth.json, db, sessões, logs)
      #   opencode-state  → /root/.local/state/opencode  (registro do serviço)
      #   herdr-config    → /root/.config/herdr         (config do herdr)
      #   herdr-state     → /root/.herdr                (worktrees, sessão, estado)
      #- opencode-config:/root/.config/opencode
      #- opencode-data:/root/.local/share/opencode
      #- opencode-state:/root/.local/state/opencode
      #- herdr-config:/root/.config/herdr
      #- herdr-state:/root/.herdr

    # O framework opencode-pentester é clonado na imagem em
    # /opt/opencode-pentester (fora do bind mount, que cobriria /workspace).
    # Aqui ele é ligado dentro do workspace, para o agente encontrar o
    # framework exatamente onde trabalha.
    # Se o workspace não for gravável pelo uid 1000 do container, o link é
    # ignorado silenciosamente e o caminho canônico continua válido:
    #   $OPENCODE_PENTESTER_DIR  ->  /opt/opencode-pentester
    entrypoint:
      - /bin/bash
      - -c
      - ln -sfn "$${OPENCODE_PENTESTER_DIR:-/opt/opencode-pentester}" /workspace/opencode-pentester 2>/dev/null || true; exec "$$@"
      - --

    command: ["/bin/bash"]

    # Dá tempo de o herdr fechar os agentes antes do SIGKILL.
    stop_grace_period: 15s

volumes:
  opencode-config:
  opencode-data:
  opencode-state:
  herdr-config:
  herdr-state:
